<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STRIKE FIRST</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #222222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
    }
    img {
      max-width: 300px;
      border-radius: 12px;
      margin-bottom: 1em;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .links {
      display: flex;
      gap: 30px;
    }
    a {
      color: #0077cc;
      font-size: 1.3em;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }
    a:hover {
      color: #005999;
    }
  </style>
</head>
<body>
  <h1>STRIKE FIRST</h1>
  <img src="https://via.placeholder.com/300x200.png?text=Your+Photo" alt="Crew Photo" />
  <div class="links">
    <a href="https://discord.com" target="_blank" rel="noopener noreferrer">Discord</a>
    <a href="https://socialclub.rockstargames.com" target="_blank" rel="noopener noreferrer">Social Club Crew</a>
  </div>
</body>
</html>
